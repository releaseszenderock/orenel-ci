# Go checks for zenderock/orenel-platform (private), run from this public repo.
# Platform issue: https://github.com/zenderock/orenel-platform/issues/24
# Logs are PUBLIC: steps print tool results only, never env values or sources.
# Secret: ORENEL_PLATFORM_TOKEN (see README.md > Setup).

name: orenel-platform go

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA of zenderock/orenel-platform
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: platform-go-${{ inputs.ref }}
  cancel-in-progress: true

env:
  PLATFORM_REPO: zenderock/orenel-platform
  STATUS_CONTEXT: orenel-ci/go

jobs:
  # Resolves the ref and posts "pending". Runs no platform code.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require the platform token
        env:
          TOKEN_SET: ${{ secrets.ORENEL_PLATFORM_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Secret ORENEL_PLATFORM_TOKEN is missing. See README.md > Setup."
            exit 1
          fi

      - name: Resolve commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          sha="$(gh api "repos/$PLATFORM_REPO/commits/$REF" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report pending status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Go checks running" -f target_url="$RUN_URL"

  # Runs platform code (dependencies, tests, builds). The token is only used
  # by the checkout step, before any platform code runs, and not persisted.
  go:
    needs: resolve
    runs-on: ubuntu-latest
    # The race and integration tests alone take 22 to 28 minutes on a loaded runner since lot 5b,
    # then the API and worker images build: 30 cut the image build of a green run. Since lot 6,
    # internal/httpapi alone takes 19 to 25+ minutes under -race, so the package timeout is 40
    # minutes and the job has room for the image builds after it. Splitting or parallelising
    # httpapi is tracked on the platform side; this is headroom, not a target.
    timeout-minutes: 60
    steps:
      - name: Check out orenel-platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: zenderock/orenel-platform
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          persist-credentials: false
          path: platform

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      # Node and pnpm for the real renderer the carousel tests start (apps/renderer).
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: platform/.node-version
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: gofmt
        id: gofmt
        working-directory: platform
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        working-directory: platform
        run: go vet ./...

      - name: Generated code is up to date (go generate, sqlc)
        working-directory: platform
        run: |
          go generate ./...
          if [ -f sqlc.yaml ] || [ -f db/sqlc.yaml ]; then
            cfg="$( [ -f sqlc.yaml ] && echo sqlc.yaml || echo db/sqlc.yaml )"
            go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff -f "$cfg"
          fi
          git diff --stat --exit-code

      - name: Install the renderer (frozen lockfile)
        working-directory: platform
        run: pnpm install --frozen-lockfile --filter 'renderer...'

      - name: Tests (race, integration and real renderer required)
        working-directory: platform
        env:
          ORENEL_REQUIRE_INTEGRATION: '1'
          ORENEL_TEST_RENDERER: '1'
        run: go test -race -count=1 -timeout 40m ./...

      - name: Build API image
        working-directory: platform
        run: docker build --quiet -f apps/api/Dockerfile -t orenel-api:ci .

      - name: Build worker image
        working-directory: platform
        run: docker build --quiet -f apps/worker/Dockerfile -t orenel-worker:ci .

  # Posts the final status from a fresh runner that never ran platform code.
  report:
    needs: [resolve, go]
    if: always() && needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report final status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          OUTCOME: ${{ needs.go.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success; description="Go checks passed"
          else
            state=failure; description="Go checks failed"
          fi
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL"
