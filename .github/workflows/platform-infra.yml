# Validates the infrastructure of zenderock/orenel-platform (private) from
# this public CI repository.
#
# Platform issue: https://github.com/zenderock/orenel-platform/issues/16
#
# Logs of this repository are PUBLIC. Steps must only print check results:
# never echo platform source, env files or secrets.
#
# Required secret (Settings > Secrets and variables > Actions):
#   ORENEL_PLATFORM_TOKEN: fine-grained PAT restricted to
#   zenderock/orenel-platform with "Contents: read" and
#   "Commit statuses: read and write".

name: orenel-platform infra

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA of zenderock/orenel-platform
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: platform-infra-${{ inputs.ref }}
  cancel-in-progress: true

env:
  PLATFORM_REPO: zenderock/orenel-platform
  STATUS_CONTEXT: orenel-ci/infra

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out orenel-platform
        uses: actions/checkout@v4
        with:
          repository: zenderock/orenel-platform
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          persist-credentials: false
          path: platform

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git -C platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Compose and OTel collector checks running" \
            -f target_url="$RUN_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compose rendering, secret guards, exposure and collector config
        id: verify
        working-directory: platform
        env:
          REQUIRE_COLLECTOR_VALIDATION: '1'
        run: infra/scripts/verify.sh

      - name: Report final status to orenel-platform
        if: always() && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success; description="Compose and OTel collector checks passed"
          else
            state=failure; description="Compose or OTel collector checks failed"
          fi
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL"
