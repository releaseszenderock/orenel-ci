# Real-stack end-to-end tests for zenderock/orenel-platform (private), run from
# this public repo: the real API and worker (built with -tags devstack, fake
# providers only) against throwaway PostgreSQL and Redis, driven by Playwright.
# Platform issues: https://github.com/zenderock/orenel-platform/issues/42 and #44.
# Runbook: docs/runbooks/real-stack-e2e.md in the platform repo.
# Logs are PUBLIC: steps print tool results only, never env values or sources.
# Secret: ORENEL_PLATFORM_TOKEN (see README.md > Setup).
#
# Contract with the platform workspace: `pnpm --filter web run test:e2e:real`.

name: orenel-platform real-stack

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA of zenderock/orenel-platform
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: platform-real-stack-${{ inputs.ref }}
  cancel-in-progress: true

env:
  PLATFORM_REPO: zenderock/orenel-platform
  STATUS_CONTEXT: orenel-ci/real-stack

jobs:
  # Resolves the ref and posts "pending". Runs no platform code.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require the platform token
        env:
          TOKEN_SET: ${{ secrets.ORENEL_PLATFORM_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Secret ORENEL_PLATFORM_TOKEN is missing. See README.md > Setup."
            exit 1
          fi

      - name: Resolve commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          sha="$(gh api "repos/$PLATFORM_REPO/commits/$REF" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report pending status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Real-stack e2e running" -f target_url="$RUN_URL"

  # Runs platform code. The token is only used by the checkout step, before any
  # platform code runs, and not persisted.
  real-stack:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out orenel-platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: zenderock/orenel-platform
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          persist-credentials: false
          path: platform

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: platform/.node-version
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      # Throwaway servers on loopback, with passwords generated for this run.
      - name: Start PostgreSQL and Redis
        run: |
          pg_password="$(openssl rand -hex 16)"
          redis_password="$(openssl rand -hex 16)"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$redis_password"
          {
            echo "PGHOST=127.0.0.1"
            echo "PGPORT=5432"
            echo "PGUSER=postgres"
            echo "PGDATABASE=postgres"
            echo "PGSSLMODE=disable"
            echo "PGPASSWORD=$pg_password"
            echo "REDIS_ADDR=127.0.0.1:6379"
            echo "REDIS_PASSWORD=$redis_password"
            echo "REDIS_DB=0"
            # A fresh runner: database 0 is the stack's own to empty.
            echo "ORENEL_DEVSTACK_FLUSH_REDIS=true"
            echo "ORENEL_DEVSTACK_FLUSH_REDIS_ALLOW_DB0=true"
            echo "ORENEL_E2E_REAL_LOG_FILE=$RUNNER_TEMP/real-stack-children.log"
          } >> "$GITHUB_ENV"

          # pgvector/pgvector:0.8.7-pg18-trixie
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$pg_password" \
            pgvector/pgvector@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa >/dev/null
          # redis:8.6.8-alpine
          docker run -d --name redis -p 127.0.0.1:6379:6379 \
            redis@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137 \
            redis-server --requirepass "$redis_password" >/dev/null

          for _ in $(seq 1 60); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 \
              && docker exec redis redis-cli -a "$redis_password" --no-auth-warning ping 2>/dev/null | grep -q PONG \
              && exit 0
            sleep 1
          done
          echo "::error::PostgreSQL or Redis did not become ready"
          exit 1

      - name: Install (frozen lockfile)
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        working-directory: platform/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Arial-metric fallback fonts
        run: sudo apt-get install -y --no-install-recommends fonts-liberation >/dev/null

      # Compiles the API and the worker (-tags devstack), creates a database,
      # applies the migrations, builds and starts the web server, then runs both
      # projects (390 and 1440 px).
      - name: Real-stack end-to-end tests
        working-directory: platform
        env:
          CI: '1'
        run: pnpm --filter web run test:e2e:real

      # Public logs: a whitelist of fields, never the lines themselves.
      - name: Redacted tail of the api and worker logs (on failure)
        if: failure()
        run: |
          f="$RUNNER_TEMP/real-stack-children.log"
          [ -s "$f" ] || { echo "no api or worker log"; exit 0; }
          tail -n 400 "$f" \
            | sed -E 's/^\[[a-z]+\] //' \
            | jq -R -c 'fromjson? | select(.msg != null)
                | {time, service, level, msg, event, outcome, route, status, job_type, queue, retry, error_class, duration_ms}
                | with_entries(select(.value != null))' \
            | tail -n 120

  # Posts the final status from a fresh runner that never ran platform code.
  report:
    needs: [resolve, real-stack]
    if: always() && needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report final status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          OUTCOME: ${{ needs.real-stack.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success; description="Real-stack e2e passed"
          else
            state=failure; description="Real-stack e2e failed"
          fi
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL"
