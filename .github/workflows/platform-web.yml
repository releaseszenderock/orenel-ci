# TypeScript checks for zenderock/orenel-platform (private), run from this public repo.
# Platform issue: https://github.com/zenderock/orenel-platform/issues/24
# Logs are PUBLIC: steps print tool results only, never env values or sources.
# Secret: ORENEL_PLATFORM_TOKEN (see README.md > Setup).
#
# Contract with the platform workspace: root scripts `lint`, `typecheck`,
# `test`, `build`, `test:e2e`, and optionally `api:lint` / `api:generate`.

name: orenel-platform web

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA of zenderock/orenel-platform
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: platform-web-${{ inputs.ref }}
  cancel-in-progress: true

env:
  PLATFORM_REPO: zenderock/orenel-platform
  STATUS_CONTEXT: orenel-ci/web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the platform token
        env:
          TOKEN_SET: ${{ secrets.ORENEL_PLATFORM_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Secret ORENEL_PLATFORM_TOKEN is missing. See README.md > Setup."
            exit 1
          fi

      - name: Check out orenel-platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: zenderock/orenel-platform
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          persist-credentials: false
          path: platform

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git -C platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status to orenel-platform
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Web checks running" -f target_url="$RUN_URL"

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: platform/.node-version
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: platform
        run: pnpm run lint

      - name: Typecheck
        working-directory: platform
        run: pnpm run typecheck

      - name: Unit and component tests
        working-directory: platform
        run: pnpm run test

      - name: OpenAPI lint and generated client up to date
        working-directory: platform
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["api:lint"] ? 0 : 1)'; then pnpm run api:lint; fi
          if node -e 'process.exit(require("./package.json").scripts?.["api:generate"] ? 0 : 1)'; then pnpm run api:generate; fi
          git diff --stat --exit-code

      - name: Build
        working-directory: platform
        run: pnpm run build

      - name: Playwright browsers
        working-directory: platform/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: platform
        run: pnpm run test:e2e

      - name: Build web image
        working-directory: platform
        run: docker build --quiet -f apps/web/Dockerfile -t orenel-web:ci .

      - name: Report final status to orenel-platform
        if: always() && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.ORENEL_PLATFORM_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success; description="Web checks passed"
          else
            state=failure; description="Web checks failed"
          fi
          gh api --silent "repos/$PLATFORM_REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL"
